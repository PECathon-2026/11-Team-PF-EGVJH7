name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never call a real LLM or spend API credits in CI.
  PRIVACYLENS_MOCK_LLM: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Node runs the extension's unit tests and the Python/JS parity test.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run extension unit tests
        working-directory: extension
        run: npm test

      - name: Run test suite
        run: python -m pytest -v --junitxml=results/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: results/junit.xml
          if-no-files-found: warn

  docker:
    name: Docker reproducibility check
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image and run suite in container
        run: docker compose up --build --exit-code-from tests
