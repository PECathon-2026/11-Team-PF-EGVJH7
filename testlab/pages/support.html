<!DOCTYPE html>
<html>
<head><title>Customer Support</title></head>
<body>
  <h1>Support Chat</h1>
  <div class="chat-container">
    <p>Agent: Hello! How can I help you today?</p>
    <p>User: Hi, I'm having an issue with my order. My email is <span id="user-email">john.doe@example.com</span> and my phone is <span id="user-phone">+91 9876543210</span>.</p>
  </div>
  <label for="message">Type your message:</label>
  <textarea id="message" name="message">Please call me back at 9876543210</textarea>
  <button id="send-btn">Send</button>
</body>
</html>
