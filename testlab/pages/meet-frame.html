<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; }
    .tile { position: relative; width: 320px; height: 180px; }
    canvas { width: 100%; height: 100%; display: block; }
    .who { position: absolute; left: 8px; bottom: 6px; font: 13px sans-serif; color: #fff; }
  </style>
</head>
<body>
  <div class="tile"><canvas width="320" height="180"></canvas><div class="who">Diya Kapoor</div></div>
  <script>
    const ctx = document.querySelector("canvas").getContext("2d");
    ctx.fillStyle = "#e76f51"; ctx.fillRect(0, 0, 320, 180);
    ctx.fillStyle = "#ffd6a5"; ctx.beginPath(); ctx.arc(160, 80, 38, 0, Math.PI * 2); ctx.fill();
  </script>
</body>
</html>
