<!DOCTYPE html>
<html>
<head><title>Create account</title></head>
<body>
  <h1>Create your account</h1>
  <form id="register">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text">

    <label for="email">Email</label>
    <input id="email" name="email" type="email">

    <label for="phone">Mobile number</label>
    <input id="phone" name="phone" type="tel">

    <label for="address">Address</label>
    <input id="address" name="address" type="text">

    <label for="password">Password</label>
    <input id="password" name="password" type="password">

    <button id="create" type="submit">Create account</button>
  </form>
  <p id="result" hidden>Account created.</p>
  <script>
    // Test fixture: record the submission instead of sending it anywhere.
    document.getElementById("register").addEventListener("submit", (event) => {
      event.preventDefault();
      window.__submitted = Object.fromEntries(new FormData(event.target));
      document.getElementById("result").hidden = false;
    });
  </script>
</body>
</html>
